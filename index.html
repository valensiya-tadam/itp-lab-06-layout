<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин кроссовок</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

    <header class="header">
        <a href="#" class="header__logo">SneakerShop</a>
        <nav class="nav">
            <a href="#catalog" class="nav__link">Каталог</a>
            <a href="#contacts" class="nav__link">Контакты</a>
        </nav>
    </header>

    <main class="main">
        <section class="hero">
            <h1 class="hero__title">Новые кроссовки 2026</h1>
            <p class="hero__text">Удобная обувь для спорта и города</p>
            <a href="#catalog" class="button">В каталог</a>
        </section>

        <section class="catalog" id="catalog">
            <h2 class="catalog__title">Наши модели</h2>

            <div class="catalog__grid">
                <article class="card">
                    <img src="img/sneaker-1.jpg" alt="Белые кроссовки" class="card__img">
                    <h3 class="card__title">Air Run White</h3>
                    <p class="card__price">8 990 ₽</p>
                    <button type="button" class="button">Купить</button>
                </article>

                <article class="card">
                    <img src="img/sneaker-2.jpg" alt="Чёрные кроссовки" class="card__img">
                    <h3 class="card__title">Street Black</h3>
                    <p class="card__price">7 500 ₽</p>
                    <button type="button" class="button">Купить</button>
                </article>

                <article class="card">
                    <img src="img/sneaker-3.jpg" alt="Синие кроссовки" class="card__img">
                    <h3 class="card__title">Sport Blue</h3>
                    <p class="card__price">9 200 ₽</p>
                    <button type="button" class="button">Купить</button>
                </article>

                <article class="card">
                    <img src="img/sneaker-4.jpg" alt="Серые кроссовки" class="card__img">
                    <h3 class="card__title">Urban Grey</h3>
                    <p class="card__price">8 100 ₽</p>
                    <button type="button" class="button">Купить</button>
                </article>
            </div>
        </section>
    </main>

    <footer class="footer" id="contacts">
        <p class="footer__text">&copy; 2026 SneakerShop</p>
    </footer>

</body>
</html>
